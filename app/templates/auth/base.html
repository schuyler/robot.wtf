<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}robot.wtf{% endblock %}</title>
  <link rel="icon" href="/static/robot.wtf.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Auth-specific styles — supplements style.css */

    .auth-card {
      max-width: 28em;
      margin: 3rem auto;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 2rem;
    }

    .auth-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #1a1a2e;
    }

    .auth-card p {
      margin-bottom: 1rem;
      color: #333;
    }

    .auth-card label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      color: #333;
    }

    .auth-card input[type="text"],
    .auth-card input[name="username"] {
      display: block;
      width: 100%;
      padding: 0.55rem 0.75rem;
      font-size: 1rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.15s;
    }

    .auth-card input[type="text"]:focus,
    .auth-card input[name="username"]:focus {
      border-color: #1a1a2e;
    }

    .auth-card small {
      display: block;
      font-size: 0.8rem;
      color: #888;
      margin-top: 0.25rem;
      margin-bottom: 1rem;
    }

    .auth-card input[type="submit"],
    .auth-card button[type="submit"] {
      display: inline-block;
      font-size: 1rem;
      font-weight: 600;
      color: #fafafa;
      background: #1a1a2e;
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .auth-card input[type="submit"]:hover,
    .auth-card button[type="submit"]:hover {
      background: #2d2d4e;
    }

    .auth-card .btn-secondary {
      display: inline-block;
      font-size: 1rem;
      font-weight: 600;
      color: #555;
      background: #fff;
      padding: 0.6rem 1.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .auth-card .btn-secondary:hover {
      color: #1a1a2e;
      border-color: #1a1a2e;
    }

    .input-group {
      display: flex;
      gap: 0;
    }

    .input-group input[name="username"] {
      flex: 1;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: none;
    }

    .input-group input[type="submit"] {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .btn-group button,
    .btn-group input[type="submit"] {
      flex: 1;
    }

    .auth-card ul {
      list-style: none;
      padding: 0;
      margin: 0 0 1rem 0;
    }

    .auth-card ul li {
      padding: 0.3rem 0;
      color: #333;
    }

    .flash-error {
      background: #861D13;
      color: white;
      padding: 0.5em 1em;
      border-radius: 4px;
      margin-bottom: 1em;
    }

    .auth-card form {
      margin-bottom: 1rem;
    }

    .auth-card form:last-child {
      margin-bottom: 0;
    }

    .auth-card code {
      word-break: break-all;
    }

    .auth-card a {
      color: #1a1a2e;
      text-decoration: underline;
    }

    .auth-card a:hover {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="/" class="wordmark"><img src="/static/robot.wtf.svg" alt="" height="24" style="vertical-align: middle; margin-right: 0.4rem;">robot.wtf</a>
      <a href="/auth/login" class="sign-in">Sign in with Bluesky</a>
    </header>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          {% if category == "error" %}
            <div class="flash-error">{{ message }}</div>
          {% else %}
            <div>{{ message }}</div>
          {% endif %}
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
