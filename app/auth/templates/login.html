{% extends 'base.html' %}

{% block title %}Login — robot.wtf{% endblock %}

{% block content %}
<article>
  <h3>Login with Bluesky</h3>
  <form method="post">
    <p>Enter your Bluesky handle to continue</p>
    <fieldset role="group">
      <input name="username" id="username" placeholder="alice.bsky.social" style="font-family: monospace;" required>
      <input type="submit" value="Login">
    </fieldset>
  </form>
  <form method="post">
    <input name="username" type="hidden" value="https://bsky.social">
    <input class="secondary" type="submit" value="Create Account with Bluesky Social">
  </form>
</article>
{% endblock %}
