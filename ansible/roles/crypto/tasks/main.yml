---
# RS256 signing keypair
- name: Generate RS256 private key
  ansible.builtin.command:
    cmd: openssl genrsa -out /srv/data/signing_key.pem 2048
    creates: /srv/data/signing_key.pem

- name: Set signing key private permissions
  ansible.builtin.file:
    path: /srv/data/signing_key.pem
    owner: robot
    group: robot
    mode: "0600"

- name: Extract RS256 public key
  ansible.builtin.command:
    cmd: openssl rsa -in /srv/data/signing_key.pem -pubout -out /srv/data/signing_key.pub
    creates: /srv/data/signing_key.pub

- name: Set signing key public permissions
  ansible.builtin.file:
    path: /srv/data/signing_key.pub
    owner: robot
    group: robot
    mode: "0644"

# ATProto OAuth confidential client JWK
- name: Install authlib in venv
  ansible.builtin.pip:
    name: authlib
    virtualenv: /srv/app/venv

- name: Copy JWK generation script
  ansible.builtin.copy:
    src: generate_jwk.py
    dest: /tmp/generate_jwk.py
    mode: "0755"

- name: Generate ATProto client JWK pair
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/python3 /tmp/generate_jwk.py
    creates: /srv/data/client_jwk.json

- name: Clean up JWK generation script
  ansible.builtin.file:
    path: /tmp/generate_jwk.py
    state: absent

- name: Set client JWK private permissions
  ansible.builtin.file:
    path: /srv/data/client_jwk.json
    owner: robot
    group: robot
    mode: "0600"

- name: Set client JWK public permissions
  ansible.builtin.file:
    path: /srv/data/client_jwk_pub.json
    owner: robot
    group: robot
    mode: "0644"
