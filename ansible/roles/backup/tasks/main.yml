---
- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Install backup script
  ansible.builtin.copy:
    src: backup.sh
    dest: /usr/local/bin/robot-backup.sh
    owner: root
    group: root
    mode: "0755"

- name: Install backup cron job
  ansible.builtin.template:
    src: backup.cron.j2
    dest: /etc/cron.d/robot-backup
    owner: root
    group: root
    mode: "0644"
