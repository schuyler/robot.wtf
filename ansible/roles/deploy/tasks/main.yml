---
# Deploy robot.wtf application code and services

- name: Create application source directory
  ansible.builtin.file:
    path: /srv/app/src
    state: directory
    owner: robot
    group: robot
    mode: "0755"

- name: Sync application code to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../app/"
    dest: /srv/app/src/app/
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
  notify: restart robot services

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: /srv/app/src/requirements.txt
    owner: robot
    group: robot
    mode: "0644"
  notify: restart robot services

- name: Install Python dependencies into venv
  ansible.builtin.pip:
    requirements: /srv/app/src/requirements.txt
    virtualenv: /srv/app/venv
    virtualenv_python: python3

- name: Install otterwiki from wikibot-io fork
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki.git@wikibot-io"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install otterwiki-api plugin
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki-api.git"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install otterwiki-semantic-search plugin
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki-semantic-search.git"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install otterwiki-mcp plugin
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki-mcp.git"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install chromadb
  ansible.builtin.pip:
    name: chromadb
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Fix venv ownership after pip install
  ansible.builtin.file:
    path: /srv/app/venv
    state: directory
    owner: robot
    group: robot
    recurse: true

- name: Generate otterwiki_secret_key if not set
  ansible.builtin.shell:
    cmd: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: _gen_secret_key
  changed_when: false

- name: Generate otterwiki_api_key if not set
  ansible.builtin.shell:
    cmd: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: _gen_api_key
  changed_when: false

- name: Generate mcp_auth_token if not set
  ansible.builtin.shell:
    cmd: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: _gen_mcp_token
  changed_when: false

- name: Set secret facts (use vars if provided, else generate)
  ansible.builtin.set_fact:
    otterwiki_secret_key: "{{ otterwiki_secret_key | default(_gen_secret_key.stdout) }}"
    otterwiki_api_key: "{{ otterwiki_api_key | default(_gen_api_key.stdout) }}"
    mcp_auth_token: "{{ mcp_auth_token | default(_gen_mcp_token.stdout) }}"

- name: Create /srv/data directory
  ansible.builtin.file:
    path: /srv/data
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Create /srv/data/chroma directory
  ansible.builtin.file:
    path: /srv/data/chroma
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Template robot.env (skip if already exists)
  ansible.builtin.template:
    src: robot.env.j2
    dest: /srv/data/robot.env
    owner: robot
    group: robot
    mode: "0600"
    force: false

- name: Template settings.cfg (skip if already exists)
  ansible.builtin.template:
    src: settings.cfg.j2
    dest: /srv/data/settings.cfg
    owner: robot
    group: robot
    mode: "0600"
    force: false

- name: Remove systemd drop-in override dirs if present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/robot-otterwiki.service.d
    - /etc/systemd/system/robot-mcp.service.d
  notify: reload systemd

- name: Copy systemd unit files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - robot-otterwiki.service
    - robot-api.service
    - robot-auth.service
    - robot-mcp.service
  notify:
    - reload systemd
    - restart robot services

- name: Enable all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - robot-otterwiki
    - robot-api
    - robot-auth
    - robot-mcp

- name: Start all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - robot-otterwiki
    - robot-api
    - robot-auth
    - robot-mcp
