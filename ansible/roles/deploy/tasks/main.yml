---
# Deploy robot.wtf application code and services

- name: Create application source directory
  ansible.builtin.file:
    path: /srv/app/src
    state: directory
    owner: robot
    group: robot
    mode: "0755"

- name: Sync application code to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../app/"
    dest: /srv/app/src/app/
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
  notify: restart robot services

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: /srv/app/src/requirements.txt
    owner: robot
    group: robot
    mode: "0644"
  notify: restart robot services

- name: Install Python dependencies into venv
  ansible.builtin.pip:
    requirements: /srv/app/src/requirements.txt
    virtualenv: /srv/app/venv
    virtualenv_python: python3
  become: true
  become_user: robot

