---
# Deploy robot.wtf application code and services

- name: Create application source directory
  ansible.builtin.file:
    path: /srv/app/src
    state: directory
    owner: robot
    group: robot
    mode: "0755"

- name: Sync application code to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../app/"
    dest: /srv/app/src/app/
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
  notify: restart robot services

- name: Sync static files to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../static/"
    dest: /srv/static/
    delete: true
  notify: restart robot services

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: /srv/app/src/requirements.txt
    owner: robot
    group: robot
    mode: "0644"
  notify: restart robot services

- name: Install Python dependencies into venv
  ansible.builtin.pip:
    requirements: /srv/app/src/requirements.txt
    virtualenv: /srv/app/venv
    virtualenv_python: python3

- name: Install otterwiki from wikibot-io fork
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/pip install --no-cache-dir --no-binary otterwiki --force-reinstall 'git+https://github.com/schuyler/otterwiki.git@wikibot-io'
  changed_when: true
  notify: restart robot services

- name: Install otterwiki-api plugin
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/pip install --no-cache-dir --no-deps --force-reinstall 'git+https://github.com/schuyler/otterwiki-api.git'
  changed_when: true
  notify: restart robot services

- name: Install otterwiki-semantic-search plugin
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/pip install --no-cache-dir --no-deps --force-reinstall 'git+https://github.com/schuyler/otterwiki-semantic-search.git'
  changed_when: true
  notify: restart robot services

- name: Install otterwiki-mcp plugin
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/pip install --no-cache-dir --no-deps --force-reinstall 'git+https://github.com/schuyler/otterwiki-mcp.git'
  changed_when: true
  notify: restart robot services

- name: Install faiss-cpu
  ansible.builtin.pip:
    name: faiss-cpu
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Fix venv ownership after pip install
  ansible.builtin.file:
    path: /srv/app/venv
    state: directory
    owner: robot
    group: robot
    recurse: true

- name: Sync wiki template to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../templates/"
    dest: /srv/app/templates/
    delete: true
  notify: restart robot services

- name: Create /srv/data directory
  ansible.builtin.file:
    path: /srv/data
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Create /srv/data/faiss directory
  ansible.builtin.file:
    path: /srv/data/faiss
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Stop and disable ChromaDB service if present
  ansible.builtin.systemd:
    name: robot-chromadb
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable robot-api service if present
  ansible.builtin.systemd:
    name: robot-api
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable robot-auth service if present
  ansible.builtin.systemd:
    name: robot-auth
    state: stopped
    enabled: false
  failed_when: false

- name: Template robot.env
  ansible.builtin.template:
    src: robot.env.j2
    dest: /srv/data/robot.env
    owner: robot
    group: robot
    mode: "0600"
  notify: restart robot services

- name: Template settings.cfg
  ansible.builtin.template:
    src: settings.cfg.j2
    dest: /srv/data/settings.cfg
    owner: robot
    group: robot
    mode: "0600"
    force: true
  notify: restart robot services

- name: Remove systemd drop-in override dirs if present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/robot-otterwiki.service.d
    - /etc/systemd/system/robot-mcp.service.d
  notify: reload systemd

- name: Copy systemd unit files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ robot_services | map('regex_replace', '$', '.service') | list }}"
  notify:
    - reload systemd
    - restart robot services

- name: Enable all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: "{{ robot_services }}"

- name: Start all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop: "{{ robot_services }}"
