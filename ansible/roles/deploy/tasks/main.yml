- name: Copy systemd unit files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - robot-otterwiki.service
    - robot-api.service
    - robot-auth.service
    - robot-mcp.service
  notify:
    - reload systemd
    - restart robot services

- name: Enable all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - robot-otterwiki
    - robot-api
    - robot-auth
    - robot-mcp

- name: Start all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - robot-otterwiki
    - robot-api
    - robot-auth
    - robot-mcp
