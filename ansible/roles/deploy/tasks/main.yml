---
# Deploy robot.wtf application code and services

- name: Create application source directory
  ansible.builtin.file:
    path: /srv/app/src
    state: directory
    owner: robot
    group: robot
    mode: "0755"

- name: Sync application code to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../app/"
    dest: /srv/app/src/app/
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
  notify: restart robot services

- name: Sync static files to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../static/"
    dest: /srv/static/
    delete: true
  notify: restart robot services

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: /srv/app/src/requirements.txt
    owner: robot
    group: robot
    mode: "0644"
  notify: restart robot services

- name: Install Python dependencies into venv
  ansible.builtin.pip:
    requirements: /srv/app/src/requirements.txt
    virtualenv: /srv/app/venv
    virtualenv_python: python3
  register: venv_requirements

- name: Copy deploy package checks
  ansible.builtin.copy:
    src: deploy_packages.py
    dest: /srv/app/deploy_packages.py
    owner: root
    group: root
    mode: "0644"

# requirements.txt holds the single fastmcp pin. fastmcp and fastmcp-slim share
# site-packages/fastmcp/; an in-place upgrade from 3.x deletes slim's __init__.py.
# Reinstall slim only when that could have happened or its files are missing.
- name: Check fastmcp-slim is installed intact
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/python /srv/app/deploy_packages.py check-dist fastmcp-slim {{ fastmcp_version }}
  register: fastmcp_slim_check
  changed_when: false
  failed_when: fastmcp_slim_check.rc not in [0, 1]

- name: Reinstall fastmcp-slim to restore fastmcp/__init__.py
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/pip install --no-cache-dir --no-deps --force-reinstall fastmcp-slim=={{ fastmcp_version }}
  when: venv_requirements is changed or fastmcp_slim_check.rc != 0
  notify: restart robot services

- name: Resolve git package refs and installed commits
  ansible.builtin.command:
    cmd: /srv/app/venv/bin/python /srv/app/deploy_packages.py git-status
    stdin: "{{ git_packages | to_json }}"
  register: git_package_status
  changed_when: false

# Installs the resolved commit, not the ref, so the installed version is exactly
# the one compared against on the next deploy.
- name: Install git packages whose commit changed
  ansible.builtin.command:
    cmd: "/srv/app/venv/bin/pip install --no-cache-dir {{ item.pip_args }} --force-reinstall 'git+{{ item.url }}@{{ item.commit }}'"
  loop: "{{ git_package_status.stdout | from_json }}"
  loop_control:
    label: "{{ item.name }} {{ item.installed | default('none', true) | truncate(12, true, '') }} -> {{ item.commit | truncate(12, true, '') }}"
  when: item.installed != item.commit
  notify: restart robot services

- name: Install faiss-cpu
  ansible.builtin.pip:
    name: faiss-cpu
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Fix venv ownership after pip install
  ansible.builtin.file:
    path: /srv/app/venv
    state: directory
    owner: robot
    group: robot
    recurse: true

- name: Sync wiki template to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../templates/"
    dest: /srv/app/templates/
    delete: true
  notify: restart robot services

- name: Create /srv/data directory
  ansible.builtin.file:
    path: /srv/data
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Create /srv/data/faiss directory
  ansible.builtin.file:
    path: /srv/data/faiss
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Stop and disable ChromaDB service if present
  ansible.builtin.systemd:
    name: robot-chromadb
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable robot-api service if present
  ansible.builtin.systemd:
    name: robot-api
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable robot-auth service if present
  ansible.builtin.systemd:
    name: robot-auth
    state: stopped
    enabled: false
  failed_when: false

- name: Remove stale robot-api unit file
  ansible.builtin.file:
    path: /etc/systemd/system/robot-api.service
    state: absent
  notify: reload systemd

- name: Remove stale robot-auth unit file
  ansible.builtin.file:
    path: /etc/systemd/system/robot-auth.service
    state: absent
  notify: reload systemd

- name: Template robot.env
  ansible.builtin.template:
    src: robot.env.j2
    dest: /srv/data/robot.env
    owner: robot
    group: robot
    mode: "0600"
  notify: restart robot services

- name: Template settings.cfg
  ansible.builtin.template:
    src: settings.cfg.j2
    dest: /srv/data/settings.cfg
    owner: robot
    group: robot
    mode: "0600"
    force: true
  notify: restart robot services

- name: Remove systemd drop-in override dirs if present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/robot-otterwiki.service.d
    - /etc/systemd/system/robot-mcp.service.d
  notify: reload systemd

- name: Copy systemd unit files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ robot_services | map('regex_replace', '$', '.service') | list }}"
  notify:
    - reload systemd
    - restart robot services

- name: Enable all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: "{{ robot_services }}"

- name: Start all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop: "{{ robot_services }}"
