---
# Deploy robot.wtf application code and services

- name: Create application source directory
  ansible.builtin.file:
    path: /srv/app/src
    state: directory
    owner: robot
    group: robot
    mode: "0755"

- name: Sync application code to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../app/"
    dest: /srv/app/src/app/
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
  notify: restart robot services

- name: Sync static files to VPS
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../static/"
    dest: /srv/static/
    delete: true
  notify: restart robot services

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: /srv/app/src/requirements.txt
    owner: robot
    group: robot
    mode: "0644"
  notify: restart robot services

- name: Install Python dependencies into venv
  ansible.builtin.pip:
    requirements: /srv/app/src/requirements.txt
    virtualenv: /srv/app/venv
    virtualenv_python: python3

- name: Install otterwiki from wikibot-io fork
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki.git@wikibot-io"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install otterwiki-api plugin
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki-api.git"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install otterwiki-semantic-search plugin
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki-semantic-search.git"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install otterwiki-mcp plugin
  ansible.builtin.pip:
    name: "git+https://github.com/schuyler/otterwiki-mcp.git"
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Install chromadb
  ansible.builtin.pip:
    name: chromadb
    virtualenv: /srv/app/venv
  notify: restart robot services

- name: Fix venv ownership after pip install
  ansible.builtin.file:
    path: /srv/app/venv
    state: directory
    owner: robot
    group: robot
    recurse: true

- name: Read existing robot.env if present
  ansible.builtin.shell:
    cmd: "grep '^{{ item }}=' /srv/data/robot.env | cut -d= -f2-"
  register: _existing_secrets
  loop:
    - OTTERWIKI_API_KEY
    - MCP_AUTH_TOKEN
  changed_when: false
  failed_when: false

- name: Read existing settings.cfg SECRET_KEY if present
  ansible.builtin.shell:
    cmd: "grep '^SECRET_KEY' /srv/data/settings.cfg | sed 's/.*\"\\(.*\\)\"/\\1/'"
  register: _existing_secret_key
  changed_when: false
  failed_when: false

- name: Set secrets (preserve existing, generate if missing)
  ansible.builtin.set_fact:
    otterwiki_api_key: "{{ _existing_secrets.results[0].stdout | default('', true) | ternary(_existing_secrets.results[0].stdout, lookup('pipe', 'python3 -c \"import secrets; print(secrets.token_hex(32))\"')) }}"
    mcp_auth_token: "{{ _existing_secrets.results[1].stdout | default('', true) | ternary(_existing_secrets.results[1].stdout, lookup('pipe', 'python3 -c \"import secrets; print(secrets.token_hex(32))\"')) }}"
    otterwiki_secret_key: "{{ _existing_secret_key.stdout | default('', true) | ternary(_existing_secret_key.stdout, lookup('pipe', 'python3 -c \"import secrets; print(secrets.token_hex(32))\"')) }}"

- name: Create /srv/data directory
  ansible.builtin.file:
    path: /srv/data
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Create /srv/data/chroma directory
  ansible.builtin.file:
    path: /srv/data/chroma
    state: directory
    owner: robot
    group: robot
    mode: "0750"

- name: Template robot.env
  ansible.builtin.template:
    src: robot.env.j2
    dest: /srv/data/robot.env
    owner: robot
    group: robot
    mode: "0600"
  notify: restart robot services

- name: Template settings.cfg (skip if already exists)
  ansible.builtin.template:
    src: settings.cfg.j2
    dest: /srv/data/settings.cfg
    owner: robot
    group: robot
    mode: "0600"
    force: false
  notify: restart robot services

- name: Remove systemd drop-in override dirs if present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/robot-otterwiki.service.d
    - /etc/systemd/system/robot-mcp.service.d
  notify: reload systemd

- name: Copy systemd unit files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ robot_services | map('regex_replace', '$', '.service') | list }}"
  notify:
    - reload systemd
    - restart robot services

- name: Enable all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: "{{ robot_services }}"

- name: Start all robot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop: "{{ robot_services }}"
