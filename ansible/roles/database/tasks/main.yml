---
- name: Copy schema to target
  ansible.builtin.copy:
    src: schema.sql
    dest: /tmp/robot_schema.sql
    mode: "0644"

- name: Create SQLite database if missing
  ansible.builtin.shell: |
    sqlite3 /srv/data/robot.db "PRAGMA journal_mode=WAL;"
  args:
    creates: /srv/data/robot.db

- name: Apply schema migrations
  ansible.builtin.shell: |
    sqlite3 /srv/data/robot.db < /tmp/robot_schema.sql
  changed_when: false

- name: Invalidate non-SHA256 token hashes (bcrypt, placeholders, etc.)
  ansible.builtin.command:
    cmd: sqlite3 /srv/data/robot.db "UPDATE wikis SET mcp_token_hash = 'invalidated:' || slug WHERE length(mcp_token_hash) != 64 OR mcp_token_hash GLOB '*[^0-9a-f]*';"
  changed_when: false

- name: Add unique index on mcp_token_hash
  ansible.builtin.command:
    cmd: sqlite3 /srv/data/robot.db "CREATE UNIQUE INDEX IF NOT EXISTS ix_wikis_mcp_token_hash ON wikis (mcp_token_hash);"
  changed_when: false

- name: Set database file ownership
  ansible.builtin.shell: chown robot:robot /srv/data/robot.db*
  args:
    removes: /srv/data/robot.db

- name: Set database file permissions
  ansible.builtin.file:
    path: /srv/data/robot.db
    mode: "0600"

- name: Clean up schema file
  ansible.builtin.file:
    path: /tmp/robot_schema.sql
    state: absent
