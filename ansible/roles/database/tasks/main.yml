---
- name: Copy schema to target
  ansible.builtin.copy:
    src: schema.sql
    dest: /tmp/robot_schema.sql
    mode: "0644"

- name: Create SQLite database if missing
  ansible.builtin.shell: |
    sqlite3 /srv/data/robot.db "PRAGMA journal_mode=WAL;"
  args:
    creates: /srv/data/robot.db

- name: Apply schema migrations
  ansible.builtin.shell: |
    sqlite3 /srv/data/robot.db < /tmp/robot_schema.sql
  changed_when: false

- name: Set database file ownership
  ansible.builtin.shell: chown robot:robot /srv/data/robot.db*
  args:
    removes: /srv/data/robot.db

- name: Set database file permissions
  ansible.builtin.file:
    path: /srv/data/robot.db
    mode: "0600"

- name: Clean up schema file
  ansible.builtin.file:
    path: /tmp/robot_schema.sql
    state: absent
