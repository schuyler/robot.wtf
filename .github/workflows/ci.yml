name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest pytest-playwright
          # Same fork production deploys (ansible/roles/deploy/tasks/main.yml).
          pip install 'git+https://github.com/schuyler/otterwiki.git@wikibot-io'
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Run tests
        env:
          FLASK_SECRET_KEY: ci-test-secret
          FLASK_ENV: testing
        run: pytest tests/
